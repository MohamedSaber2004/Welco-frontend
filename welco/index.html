<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/jpeg" href="/logo.jpeg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="/logo.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welco — Surgical Instrument Manufacturer. Precision instruments built for the operating room, with OEM private-label production and full ISO / CE documentation.">
    <meta name="theme-color" content="#1E1F22">
    <title>Welco — Surgical Instruments Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .font-display-lg { font-family: 'Plus Jakarta Sans', 'Sora', 'Alexandria', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-weight:800; letter-spacing:-0.028em; line-height:1.06; }
      .font-headline-lg { font-family: 'Plus Jakarta Sans', 'Sora', 'Alexandria', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-weight:700; letter-spacing:-0.022em; line-height:1.12; }
      .font-title-lg { font-family: 'Plus Jakarta Sans', 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif; font-weight:600; }
      [dir='rtl'] .font-display-lg, [dir='rtl'] .font-headline-lg, [dir='rtl'] .font-title-lg { font-family: 'Alexandria', 'IBM Plex Sans Arabic', system-ui, sans-serif; letter-spacing: normal; }
      .chain-line { position:relative; }
      .chain-line::before { content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:linear-gradient(to right, #4F46E5, #6366F1); opacity:0.25; }
      html[data-theme='dark'] .chain-line::before { opacity: 0.35; }
    </style>
    <script>
      (function () {
        try {
          /* Dark-only: white mode removed — always apply dark before paint. */
          localStorage.setItem('welco-theme', 'dark')
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          var locale = localStorage.getItem('welco-locale')
          if (locale === 'ar') {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          } else if (locale === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.dir = 'ltr'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
