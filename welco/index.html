    .chain-line {
      position: relative;
    }

    .chain-line::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: linear-gradient(to right, #0F3D56, #147D92);
      opacity: 0.35;
    }
  </style>
  <script>
    (function () {
      try {
        /* Light-only mode: always white, purge any stale dark preference. Avoids FOUC. */
        try {
          if (localStorage.getItem('welco-theme') !== 'light') localStorage.setItem('welco-theme', 'light')
        } catch (e) { }
        document.documentElement.dataset.theme = 'light'
        document.documentElement.classList.remove('dark')
        document.documentElement.style.colorScheme = 'light'
        var locale = localStorage.getItem('welco-locale')
        if (locale === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        } else if (locale === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      } catch (e) { }
    })()
  </script>
